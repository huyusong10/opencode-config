# System Loop Plugin Configuration
# 系统工程师循环迭代插件配置

# 是否启用系统工程师循环
# Enable system engineer iteration loop
enabled: true

# 最大迭代次数
# Maximum number of iterations (default: 3)
max_iterations: 3

# 触发系统工程师的 agent 列表
# Agents that trigger system engineer review
trigger_agents:
  - maestro
  - architect
  - maker

# 是否自动触发 (检测到标签时自动调用)
# Auto-trigger when tag is detected
auto_trigger: true

# 跳过系统评审的标签
# Tags that skip system review
# 如果输出中包含这些标签，则跳过系统工程师调用
# If output contains these tags, skip system engineer call
skip_tags:
  - skip-system-review
  - quick-fix
  - docs-only
  - minor-change
  - typo-fix
  - config-update