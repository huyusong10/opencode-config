# 深度探索引导提示词
# =====================
#
# 当工具操作失败时注入引导提示词，
# 鼓励深入调查而非跳过错误。
#
# 理念：引导而非强制，让 AI 自行决定行动。

# 每个会话最大引导注入次数（0 = 无限制）
max_injections: 0

# ─────────────────────────────────────────────────────────────
# 失败引导
# ─────────────────────────────────────────────────────────────

# 工具首次失败时触发
first_failure:
  template: |
    ---

    ## 重试前请先调查

    `{tool}` 操作失败。

    **切勿立即重试相同操作。**

    {tool_tips}

    ### 调查方法

    1. 理解哪里出了问题
    2. 验证你的假设
    3. 形成假设
    4. 修复前先测试

    ---

# 同一工具多次失败时触发
multiple_failures:
  threshold: 2
  template: |
    ---

    ## 多次失败

    `{tool}` 已失败 {count} 次。

    **你可能遗漏了某些根本问题。**

    请问自己：
    - 是否有前置条件未检查？
    - 是否应该先读取某个文件？
    - 是否应该尝试其他方法？

    ---

# 相同错误重复出现时触发
repetition:
  threshold: 3
  template: |
    ---

    ## 重复失败

    相同错误已出现 {count} 次。

    **停下来重新审视你的方法。**

    可选方案：
    - 读取更多上下文
    - 尝试不同的方法
    - 寻求澄清

    ---

# 工具特定提示（注入到首次失败模板中）
tool_tips:
  bash: |
    命令失败时：
    - 完整阅读错误信息
    - 检查命令/依赖是否存在

  edit: |
    编辑失败时：
    - 验证 oldString 是否完全匹配
    - 先读取文件

  write: |
    写入失败时：
    - 检查目录是否存在
    - 验证权限

  read: |
    读取失败时：
    - 验证文件路径是否正确
    - 检查文件是否存在

  glob: |
    glob 失败时：
    - 验证模式语法
    - 检查目录是否存在

  grep: |
    grep 失败时：
    - 验证正则表达式模式
    - 检查文件模式

  pty_spawn: |
    进程失败时：
    - 检查命令是否存在
    - 验证参数

  default: |
    仔细阅读错误信息并检查假设。

# ─────────────────────────────────────────────────────────────
# 成功引导（可选）
# ─────────────────────────────────────────────────────────────

# 是否为成功操作提供引导？
success_guidance:
  enabled: false

  # 哪些工具提供成功引导
  tools:
    - write
    - edit

  template: |
    ---

    ## 快速质量检查

    `{tool}` 成功。继续之前：

    - 实现是否符合规范？
    - 边界情况是否处理？
    - 测试是否需要更新？

    ---

# ─────────────────────────────────────────────────────────────
# 调试器提示
# ─────────────────────────────────────────────────────────────

# 当验证命令失败时，建议调用 @debugger
debugger_hint:
  enabled: true

  # 被视为"验证"的命令
  verification_patterns:
    - "npm test"
    - "npm run test"
    - "pytest"
    - "cargo test"
    - "go test"
    - "npm run lint"
    - "npm run build"
    - "tsc"
    - "ruff"
    - "mypy"

  template: |
    ---

    ## 验证失败

    考虑使用 `@debugger` 进行调查：

    ```
    @debugger
    分析此验证失败的原因并提出修复方案。
    ```

    ---